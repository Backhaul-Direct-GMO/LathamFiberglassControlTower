<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latham Fiberglass Control Tower — Backhaul Direct</title>
<style>
:root{
  --navy:#152a45; --navy-2:#1d3a5f; --navy-3:#0e1f35;
  --ink:#1c2733; --ink-2:#45566b; --ink-3:#71839b;
  --bg:#f3f5f8; --panel:#ffffff; --line:#dde3ec; --line-2:#eef1f6;
  --blue:#2563a8; --blue-soft:#e8f0fa;
  --green:#1e7a4c; --green-soft:#e4f3ea;
  --amber:#9a6a06; --amber-soft:#fcf2da;
  --red:#b23330; --red-soft:#fbe9e8;
  --violet:#5b4ba6; --violet-soft:#edeafa;
  --radius:6px;
  --shadow:0 1px 2px rgba(21,42,69,.07), 0 1px 6px rgba(21,42,69,.05);
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:.92rem; line-height:1.45;
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--blue)}

/* ===== App frame ===== */
.app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:52px 1fr;height:100vh;overflow:hidden}
.topbar{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--navy-3)}
.brandmark{display:flex;align-items:center;gap:10px;min-width:220px}
.brandmark .bhd{background:#fff;color:var(--navy);font-weight:800;letter-spacing:.4px;border-radius:4px;padding:2px 7px;font-size:.8rem}
.brandmark .prod{font-weight:600;font-size:.95rem;letter-spacing:.2px}
.brandmark .prod small{display:block;font-weight:400;font-size:.68rem;color:#a8bcd6;letter-spacing:.4px}
.topbar .spacer{flex:1}
.rolebox{display:flex;align-items:center;gap:8px;background:var(--navy-2);border:1px solid #2c4a73;border-radius:6px;padding:5px 10px}
.rolebox label{font-size:.72rem;color:#a8bcd6}
.rolebox select{background:transparent;border:0;color:#fff;font-weight:600;outline:none}
.rolebox select option{color:var(--ink)}
.viewtag{font-size:.72rem;padding:3px 9px;border-radius:99px;font-weight:700;letter-spacing:.3px}
.viewtag.internal{background:#33507a;color:#cfe0f5}
.viewtag.customer{background:#1e7a4c;color:#e4f3ea}
.envtag{font-size:.7rem;color:#a8bcd6;border:1px dashed #3b5b88;border-radius:5px;padding:3px 8px}

/* ===== Nav ===== */
.nav{background:var(--navy-3);color:#c3d2e6;overflow-y:auto;padding:14px 0 24px}
.nav .group{margin-top:14px}
.nav .group:first-child{margin-top:2px}
.nav .grouplabel{font-size:.68rem;color:#7d94b3;padding:4px 18px 6px;letter-spacing:.5px}
.nav a.item{display:flex;align-items:center;gap:10px;color:#c3d2e6;text-decoration:none;padding:8px 18px;font-size:.88rem;border-left:3px solid transparent}
.nav a.item:hover{background:#152a45;color:#fff}
.nav a.item.active{background:#152a45;color:#fff;border-left-color:#5a8fd0;font-weight:600}
.nav a.item .cnt{margin-left:auto;background:#2c4a73;color:#dbe7f6;border-radius:99px;font-size:.68rem;padding:1px 7px}
.nav a.item .cnt.red{background:var(--red);color:#fff}
.nav a.item .cnt.amber{background:var(--amber);color:#fff}
.nav .lockline{margin:16px 14px 0;padding:9px 10px;border:1px solid #2c4a73;border-radius:6px;font-size:.7rem;color:#93a9c6;line-height:1.4}
.nav .lockline b{color:#cfe0f5}

/* ===== Main ===== */
.main{overflow-y:auto;padding:20px 24px 60px}
.viewhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.viewhead h1{font-size:1.25rem;font-weight:700;letter-spacing:.1px}
.viewhead .sub{color:var(--ink-3);font-size:.85rem;margin-top:2px;max-width:70ch}
.viewhead .actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:7px 13px;font-size:.85rem;font-weight:600;color:var(--ink)}
.btn:hover{border-color:#b9c5d6;background:#fafbfd}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1f5591}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;color:var(--blue)}
.btn.sm{padding:4px 9px;font-size:.76rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .cardhead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.card .cardhead h2{font-size:.92rem;font-weight:700}
.card .cardhead .hint{color:var(--ink-3);font-size:.76rem}
.card .cardhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card .cardbody{padding:14px}
.card .cardbody.flush{padding:0}

.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1200px){.cols-4{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.app{grid-template-columns:64px 1fr}.nav .grouplabel,.nav a.item span.t,.nav .lockline{display:none}.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}

/* ===== KPI tiles ===== */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);position:relative}
.kpi .lbl{font-size:.74rem;color:var(--ink-3);font-weight:600}
.kpi .val{font-size:1.5rem;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.kpi .meta{font-size:.72rem;color:var(--ink-3);margin-top:2px}
.kpi .sig{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:99px}
.sig.g{background:var(--green)} .sig.a{background:#d99b1c} .sig.r{background:var(--red)} .sig.n{background:#9db0c7}
.kpi .delta{font-size:.72rem;font-weight:700;margin-left:6px}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}

/* ===== Badges ===== */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.a{background:var(--amber-soft);color:var(--amber)}
.badge.r{background:var(--red-soft);color:var(--red)}
.badge.b{background:var(--blue-soft);color:var(--blue)}
.badge.n{background:#eef1f6;color:var(--ink-2)}
.badge.v{background:var(--violet-soft);color:var(--violet)}
.badge.internal{background:#152a45;color:#cfe0f5}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;vertical-align:1px}

/* ===== Tables ===== */
table.data{width:100%;border-collapse:collapse;font-size:.83rem}
table.data th{position:sticky;top:0;text-align:left;background:#f8fafc;border-bottom:1px solid var(--line);padding:8px 12px;font-size:.72rem;color:var(--ink-2);font-weight:700;white-space:nowrap;z-index:2}
table.data td{border-bottom:1px solid var(--line-2);padding:8px 12px;vertical-align:top}
table.data tr:hover td{background:#f7fafd}
table.data tr.clickable{cursor:pointer}
table.data td .primaryline{font-weight:600}
table.data td .subline{color:var(--ink-3);font-size:.74rem;margin-top:1px}
table.data td.num, table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;max-height:560px}

/* ===== Filter bar ===== */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filterbar select,.filterbar input[type=text],.filterbar input[type=search]{border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;font-size:.83rem;background:#fff}
.filterbar .chip{border:1px solid var(--line);border-radius:99px;background:#fff;padding:5px 12px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.filterbar .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ===== Forms ===== */
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
@media(max-width:1100px){.formgrid{grid-template-columns:repeat(2,1fr)}}
.field label{display:block;font-size:.74rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;font-size:.85rem;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #bcd3ec;border-color:var(--blue)}
.field .fieldnote{font-size:.7rem;color:var(--ink-3);margin-top:3px}
.field.invalid input,.field.invalid select{border-color:var(--red);background:#fff8f7}
.field.invalid .fieldnote{color:var(--red);font-weight:600}
.sectiondivider{grid-column:1/-1;border-top:1px solid var(--line-2);padding-top:10px;margin-top:4px;font-size:.8rem;font-weight:700;color:var(--navy)}

/* ===== Checklist / gates ===== */
.gate{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.gate:last-child{border-bottom:0}
.gate .tick{width:20px;height:20px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;margin-top:1px}
.gate.done .tick{background:var(--green-soft);color:var(--green)}
.gate.open .tick{background:var(--red-soft);color:var(--red)}
.gate.warn .tick{background:var(--amber-soft);color:var(--amber)}
.gate .gt{font-weight:600;font-size:.84rem}
.gate .gs{font-size:.75rem;color:var(--ink-3)}
.gatebanner{display:flex;gap:10px;align-items:center;border-radius:var(--radius);padding:10px 14px;font-size:.85rem;font-weight:600;margin-bottom:12px}
.gatebanner.blocked{background:var(--red-soft);color:var(--red);border:1px solid #eccfce}
.gatebanner.ready{background:var(--green-soft);color:var(--green);border:1px solid #cbe6d6}

/* ===== Milestones ===== */
.timeline{list-style:none}
.timeline li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 0;align-items:start}
.timeline .node{width:12px;height:12px;border-radius:99px;border:2px solid #b9c5d6;background:#fff;margin:4px auto 0;position:relative}
.timeline li.done .node{background:var(--green);border-color:var(--green)}
.timeline li.now .node{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.timeline li .mt{font-size:.83rem;font-weight:600}
.timeline li.pending .mt{color:var(--ink-3);font-weight:500}
.timeline li .ms{font-size:.72rem;color:var(--ink-3)}
.timeline li .mtime{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===== Misc ===== */
.split{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.notice{border-radius:var(--radius);padding:10px 13px;font-size:.8rem;line-height:1.5;border:1px solid}
.notice.info{background:var(--blue-soft);border-color:#cfe0f3;color:#1d4c7d}
.notice.warn{background:var(--amber-soft);border-color:#efdcae;color:var(--amber)}
.notice.danger{background:var(--red-soft);border-color:#eccfce;color:var(--red)}
.notice.internal{background:#f0f3f8;border-color:#d5deea;color:var(--ink-2)}
.notice b{font-weight:700}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:.83rem}
.kv dt{color:var(--ink-3)}
.kv dd{font-weight:600}
.masked{color:var(--ink-3);font-style:italic;font-weight:500}
.money{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--ink-3);align-items:center;flex-wrap:wrap}
.emptystate{padding:44px 20px;text-align:center;color:var(--ink-3)}
.emptystate .big{font-size:1rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.commrow{padding:10px 12px;border-bottom:1px solid var(--line-2)}
.commrow:last-child{border-bottom:0}
.commrow .who{font-size:.76rem;font-weight:700}
.commrow .when{font-size:.7rem;color:var(--ink-3);margin-left:6px;font-weight:400}
.commrow .msg{font-size:.82rem;margin-top:2px}
.commrow.internalnote{background:#f6f8fb;border-left:3px solid var(--navy)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;font-size:.85rem;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--blue)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.minitable{width:100%;border-collapse:collapse;font-size:.8rem}
.minitable td{padding:5px 8px;border-bottom:1px solid var(--line-2)}
.minitable td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.minitable tr.total td{border-top:2px solid var(--line);font-weight:700}
.scorebarrow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;padding:6px 0;font-size:.8rem}
.modalback{position:fixed;inset:0;background:rgba(15,28,45,.45);display:none;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:50}
.modalback.open{display:flex}
.modal{background:#fff;border-radius:8px;max-width:640px;width:100%;box-shadow:0 10px 40px rgba(10,20,35,.35);max-height:80vh;overflow:auto}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:6px;font-size:.85rem;box-shadow:0 6px 24px rgba(10,20,35,.35);display:none;z-index:60}
.toast.show{display:block}
.loading{padding:40px;text-align:center;color:var(--ink-3);font-size:.85rem}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:99px;margin:0 auto 10px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
</style>
</head>

<script>
/* =====================================================

   ===================================================== */
let ROLE = 'bhd-exec';
let ROUTE = 'dashboard';
let ROUTE_ARG = null;

const ROLE_META = {
  'bhd-exec':      {label:'BHD Executive', customer:false, canSeeCarrier:true,  canSeeBuy:true,  billing:true},
  'bhd-custops':   {label:'BHD Customer Operations', customer:false, canSeeCarrier:true, canSeeBuy:true, billing:true},
  'bhd-capacity':  {label:'BHD Capacity / Carrier Ops', customer:false, canSeeCarrier:true, canSeeBuy:true, billing:false},
  'bhd-billing':   {label:'BHD Billing & Audit', customer:false, canSeeCarrier:true, canSeeBuy:true, billing:true},
  'latham-exec':   {label:'Latham Executive', customer:true, canSeeCarrier:false, canSeeBuy:false, billing:false},
  'latham-plant':  {label:'Latham Plant — Jane Lew', customer:true, canSeeCarrier:false, canSeeBuy:false, billing:false},
  'auditor':       {label:'Read-Only Auditor', customer:false, canSeeCarrier:true, canSeeBuy:true, billing:true, readOnly:true}
};
const isCust = () => ROLE_META[ROLE].customer;
const seeCarrier = () => ROLE_META[ROLE].canSeeCarrier;
const seeBuy = () => ROLE_META[ROLE].canSeeBuy;
const readOnly = () => !!ROLE_META[ROLE].readOnly;

const NAV = [
  {group:'Operate', items:[
    {r:'dashboard', t:'Command Center', icon:'▦', roles:'all'},
    {r:'board', t:'Live Shipment Board', icon:'☰', roles:'all', cnt:()=>SHIPMENTS.filter(s=>!['Closed','Delivered'].includes(s.status)).length},
    {r:'intake', t:'New Shipment Request', icon:'✚', roles:'all'},
    {r:'exceptions', t:'Exception Center', icon:'⚑', roles:'all', cnt:()=>EXCEPTIONS.filter(e=>e.status.startsWith('Open')).length, cntClass:'red'}
  ]},
  {group:'Plan & Buy (BHD)', internal:true, items:[
    {r:'planning', t:'Planning Workspace', icon:'◧', roles:'bhd'},
    {r:'tender', t:'Tender Management', icon:'⇄', roles:'bhd', cnt:()=>1, cntClass:'amber'},
    {r:'carriers', t:'Carrier Network', icon:'🔒', roles:'bhd'},
    {r:'rates', t:'Rate & Cost Governance', icon:'▤', roles:'bhd'}
  ]},
  {group:'Settle', items:[
    {r:'billing', t:'Billing & Reconciliation', icon:'⚖', roles:'billing'},
    {r:'reports', t:'Reports & Scorecards', icon:'▥', roles:'all'}
  ]},
  {group:'Govern', items:[
    {r:'admin', t:'Administration', icon:'⚙', roles:'bhd'}
  ]}
];

function navAllowed(item){
  if(item.roles==='all') return true;
  if(item.roles==='bhd') return !isCust();
  if(item.roles==='billing') return !isCust() && (ROLE_META[ROLE].billing || ROLE==='auditor');
  return false;
}

function renderNav(){
  const nav = document.getElementById('sideNav');
  let h='';
  NAV.forEach(g=>{
    const items = g.items.filter(navAllowed);
    if(!items.length) return;
    h += `<div class="group"><div class="grouplabel">${g.group}</div>`;
    items.forEach(it=>{
      const active = ROUTE===it.r ? 'active':'';
      const cnt = it.cnt ? `<span class="cnt ${it.cntClass||''}">${it.cnt()}</span>` : '';
      h += `<a href="#" class="item ${active}" onclick="go('${it.r}');return false;"><span aria-hidden="true">${it.icon}</span><span class="t">${it.t}</span>${cnt}</a>`;
    });
    h += `</div>`;
  });
  h += `<div class="lockline">${isCust()
      ? '<b>Customer-safe view.</b> Capacity is shown by status only. Carrier identity, contacts and BHD buy rates are managed inside Backhaul Direct.'
      : '<b>BHD internal view.</b> Carrier identity, buy rates and margin are restricted fields — never exposed to customer roles, exports or notifications.'}</div>`;
  nav.innerHTML = h;
}

function setRole(r){
  ROLE = r;
  const vt = document.getElementById('viewTag');
  if(isCust()){ vt.textContent='Latham Customer Portal'; vt.className='viewtag customer'; }
  else if(ROLE==='auditor'){ vt.textContent='Auditor — Read Only (logged)'; vt.className='viewtag internal'; }
  else { vt.textContent='BHD Internal View'; vt.className='viewtag internal'; }
  // If current route is not allowed for this role, fall back to dashboard
  const flat = NAV.flatMap(g=>g.items);
  const cur = flat.find(i=>i.r===ROUTE);
  if(cur && !navAllowed(cur)) ROUTE='dashboard';
  render();
  toast(`Viewing as ${ROLE_META[ROLE].label}`);
}

function go(r,arg=null){ ROUTE=r; ROUTE_ARG=arg; render(); document.getElementById('main').scrollTop=0; }

function render(){
  renderNav();
  const m=document.getElementById('main');
  m.innerHTML = `<div class="loading"><div class="spinner"></div>Loading ${ROUTE==='detail'?'shipment':'workspace'}…</div>`;
  setTimeout(()=>{ m.innerHTML = VIEWS[ROUTE] ? VIEWS[ROUTE]() : VIEWS.dashboard(); wireUp(); }, 120);
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2600);
}
function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modalBack').classList.add('open'); }
function closeModal(){ document.getElementById('modalBack').classList.remove('open'); }

/* ===== helpers ===== */
const $money = n => n==null?'—':'$'+n.toLocaleString();
function statusBadge(s){
  const map={'In Transit':'b','Tender Accepted':'g','Permit Delay':'a','Ready to Tender':'g','Planning':'n','Delivered':'g','Delivered — Exception':'r','Tendered — Awaiting Accept':'a','Intake — Data Gaps':'r','Closed':'n'};
  return `<span class="badge ${map[s]||'n'}">${s}</span>`;
}
function riskBadge(r){ return {g:'<span class="badge g">Low</span>',a:'<span class="badge a">Watch</span>',r:'<span class="badge r">High</span>'}[r]; }
function capacityLabel(s){
  // Customer-safe capacity language
  if(!s.carrierId){
    if(s.status==='Ready to Tender') return '<span class="badge b">Qualified Provider Identified</span>';
    if(s.status==='Tendered — Awaiting Accept') return '<span class="badge a">Tender in Progress</span>';
    return '<span class="badge n">Capacity Planning</span>';
  }
  if(['Delivered','Closed','Delivered — Exception','In Transit'].includes(s.status)) return '<span class="badge g">Carrier Confirmed</span>';
  return '<span class="badge g">Assigned Capacity — Equipment Confirmed</span>';
}
function carrierCell(s){
  if(!seeCarrier()) return `<div>${capacityLabel(s)}</div>`;
  if(!s.carrierId) return `<div>${capacityLabel(s)}</div><div class="subline">No carrier assigned yet</div>`;
  const c=CARRIERS.find(c=>c.id===s.carrierId);
  return `<div class="primaryline">${c.name}</div><div class="subline">${c.tier}</div>`;
}
function shipOf(id){ return SHIPMENTS.find(s=>s.id===id); }
function wireUp(){ /* hook for post-render wiring per view */ if(window._wire){window._wire(); window._wire=null;} }

const VIEWS = {};
function restrictedView(title){
  return `<div class="viewhead"><div><h1>${title}</h1></div></div>
  <div class="card"><div class="emptystate"><div class="big">This area is managed by Backhaul Direct</div>
  Carrier identity, procurement and internal cost detail live inside BHD's restricted operations view.<br>
  Your portal shows capacity by status on every load: Qualified Provider · Primary Capacity · Backup Capacity · Carrier Confirmed.</div></div>`;
}

VIEWS.board = function(){

  </tr>`).join('');

  return `
  <div class="viewhead">
    <div><h1>Live Shipment Board</h1><div class="sub">Every program load from request through closeout. Click a row for the full shipment record.</div></div>
    <div class="actions">
      <button class="btn" onclick="toast('Calendar view (demo)')">Calendar</button>
      <button class="btn" onclick="toast('Kanban view (demo)')">Board</button>
      <button class="btn primary" onclick="go('intake')">New request</button>
    </div>
  </div>
  <div class="filterbar">
    <input type="search" placeholder="Search load, PO, dealer, city…" id="boardSearch" oninput="filterBoard()">
    <select id="fPlant" onchange="filterBoard()"><option value="">All plants</option><option>Jane Lew, WV</option></select>
    <select id="fStatus" onchange="filterBoard()"><option value="">All statuses</option>${[...new Set(SHIPMENTS.map(s=>s.status))].map(s=>`<option>${s}</option>`).join('')}</select>
    <select id="fRisk" onchange="filterBoard()"><option value="">All risk</option><option value="g">Low</option><option value="a">Watch</option><option value="r">High</option></select>
    <button class="chip" onclick="toast('Saved filter applied (demo)')">My open exceptions</button>
    <button class="chip" onclick="toast('Saved filter applied (demo)')">Pickups next 48h</button>
  </div>
  <div class="card"><div class="cardbody flush tablewrap">
    <table class="data" id="boardTable"><thead><tr>
      <th>Load</th><th>Origin</th><th>Destination</th><th>Windows</th><th>Equipment</th><th>Readiness</th>
      <th>${isCust()?'Assigned capacity':'Carrier'}</th><th>Status</th><th>Tracking</th><th>Permits</th><th>Risk</th><th>Exceptions</th>
    </tr></thead><tbody>${rows}</tbody></table>
  </div></div>`;
};
function filterBoard(){
  const q=(document.getElementById('boardSearch').value||'').toLowerCase();
  const st=document.getElementById('fStatus').value;
  const rk=document.getElementById('fRisk').value;
  document.querySelectorAll('#boardTable tbody tr').forEach((tr,i)=>{
    const s=SHIPMENTS[i];
    let ok=true;
    if(q && !(s.id+s.po+s.dest+s.lane).toLowerCase().includes(q)) ok=false;
    if(st && s.status!==st) ok=false;
    if(rk && s.risk!==rk) ok=false;
    tr.style.display=ok?'':'none';
  });
}

<script>

const MILESTONES = ['Shipment requested','Data validated','Planning complete','Customer rate approved','Capacity confirmed','Tender accepted','Equipment confirmed','Permits secured','Pickup appointment confirmed','Arrived at origin','Loaded','Departed','In transit','Arrived at destination','Unloaded','Proof of delivery received','Costs reconciled','Customer billed','Carrier paid','Shipment closed'];
const MILESTONE_PROGRESS = {

  'Tender Accepted':9,'In Transit':13,'Delivered':16,'Delivered — Exception':16,'Closed':20
};

VIEWS.detail = function(){
  const s = shipOf(ROUTE_ARG) || SHIPMENTS[0];

  const tl = MILESTONES.map((m,i)=>{
    const cls = i<prog?'done':(i===prog?'now':'pending');
    return `<li class="${cls}"><span class="node" aria-hidden="true"></span><div><div class="mt">${m}</div>${i===prog?'<div class="ms">Current step</div>':''}</div><span class="mtime">${i<prog?(times[i]||'✓'):''}</span></li>`;
  }).join('');

  const c = s.carrierId ? CARRIERS.find(c=>c.id===s.carrierId) : null;
  const pass = s.passThrough.permits + s.passThrough.escorts + s.passThrough.tolls;

  const costCard = seeBuy() ? `
    <div class="card"><div class="cardhead"><h2>Cost & margin</h2><span class="badge internal">BHD internal</span></div>

      <tr><td>Tolls (pass-through)</td><td>${$money(s.passThrough.tolls)}</td></tr>
      ${s.customerRate?`<tr class="total"><td>Expected BHD gross profit</td><td>${$money(s.customerRate - s.carrierBuy - pass)} · ${Math.round((s.customerRate-s.carrierBuy-pass)/s.customerRate*100)}%</td></tr>`:''}
    </table>
    <div class="notice internal" style="margin-top:10px">No commission is calculated on pass-through items (permits, escorts, pilot cars, tolls, quick-pay) or on incumbent/inherited volume. Funding status: <b>${s.funding}</b>.</div>

      <tr><td>All-in approved charge</td><td>${$money(s.customerRate)}</td></tr>

  const capacityCard = seeCarrier() ? `
    <div class="card"><div class="cardhead"><h2>Assigned capacity</h2><span class="badge internal">BHD internal</span></div>
    <div class="cardbody">${c?`
      <dl class="kv">
        <dt>Carrier</dt><dd>${c.name}</dd>
        <dt>MC / DOT</dt><dd>${c.mc} · ${c.dot}</dd>
        <dt>Dispatcher</dt><dd>${c.contact} · ${c.phone}</dd>
        <dt>Role on lane</dt><dd>${c.tier}</dd>
        <dt>Insurance</dt><dd>${c.insurance}</dd>
        <dt>Tracking</dt><dd>${s.track}</dd>
      </dl>`:`<div class="emptystate"><div class="big">No carrier assigned yet</div>Capacity will be assigned from the qualified network in Tender Management.</div>`}
    </div></div>` : `
    <div class="card"><div class="cardhead"><h2>Assigned capacity</h2></div>
    <div class="cardbody">
      <dl class="kv">
        <dt>Capacity status</dt><dd>${capacityLabel(s)}</dd>
        <dt>Provider standing</dt><dd>${c?'Qualified Provider — vetted for over-dimensional fiberglass':'Sourcing from qualified network'}</dd>
        <dt>Equipment</dt><dd>${s.equip}</dd>
        <dt>Tracking</dt><dd>${s.track && s.track!=='—' ? 'Active — live milestones below' : 'Activates at tender acceptance'}</dd>
      </dl>
      <div class="notice info" style="margin-top:10px">Backhaul Direct is your single accountable provider. Carrier sourcing, qualification, negotiation and payment are managed by BHD inside this program.</div>

  const comms = (COMMS[s.id]||[]).filter(m=>!m.internal || !isCust());
  const commHtml = comms.length ? comms.map(m=>`<div class="commrow ${m.internal?'internalnote':''}">

      <div class="msg">${m.msg}</div></div>`).join('')

  return `
  <div class="viewhead">
    <div><h1>${s.id} <span style="font-weight:400;color:var(--ink-3);font-size:1rem">· ${s.lane}</span></h1>

  <div class="split">
    <div style="display:grid;gap:14px;align-content:start">

        </dl>

          <dt>Loading</dt><dd>Plant overhead crane</dd>
          <dt>Unloading</dt><dd>Dealer crane on site</dd>
          <dt>Stackability</dt><dd>Nested pair where noted; no top load</dd>
        </dl>
      </div></div></div>
      ${costCard}
      <div class="card"><div class="cardhead"><h2>Communication — this load</h2><span class="hint">Customer thread ${isCust()?'':'+ internal notes'}</span></div>
        <div class="cardbody flush">${commHtml}

        </div>
      </div>
    </div>
    <div style="display:grid;gap:14px;align-content:start">
      ${capacityCard}
      <div class="card"><div class="cardhead"><h2>Milestones & audit trail</h2></div>
        <div class="cardbody"><ul class="timeline">${tl}</ul>

        </div>
      </div>
    </div>
  </div>`;

    <div class="cardbody flush"><table class="data"><thead><tr><th>Lane</th><th>Type</th><th>Basis</th><th class="num">Approved rate</th><th>Expires</th><th>History</th><th class="num">Variance</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="grid cols-2">
    <div class="card"><div class="cardhead"><h2>Cost components & rules</h2></div>
      <div class="cardbody"><div class="pillrow" style="margin-bottom:10px">
        ${['Truck linehaul','Fuel surcharge','Trailer / equipment','Permits','Escorts','Pilot cars','Tolls','Accessorials','Layover','Detention','Redelivery','Storage','Quick-pay','Other approved'].map(x=>`<span class="badge n">${x}</span>`).join(' ')}

        <dt>Pricing modes</dt><dd>Contract · Spot · All-in approved · Cost-plus fallback</dd>
        <dt>Approval thresholds</dt><dd>Spot &gt; $4,000 → Exec · Accessorial &gt; $250 → Ops lead</dd>
        <dt>Margin alert</dt><dd>&lt; 9% or &gt; 26% flags for review</dd>
        <dt>Variance alert</dt><dd>±5% vs. lane history</dd>
        <dt>Scope</dt><dd>Customer- and plant-specific pricing supported</dd>
        <dt>Version control</dt><dd>Every change stamped: who, when, prior value</dd>
      </dl></div>
    </div>
  </div>`;
};
</script>
<script>
/* =====================================================
   VIEW: BILLING, AUDIT & RECONCILIATION
   ===================================================== */
VIEWS.billing = function(){
  if(isCust()) return restrictedView('Billing & Reconciliation');
  const rows = BILLING.map(b=>`<tr>
    <td><div class="primaryline">${b.ship}</div><div class="subline"><a href="#" onclick="go('detail','${b.ship}');return false;">Open load</a></div></td>
    <td class="num money">${b.charge?$money(b.charge):'—'}</td>
    ${seeBuy()?`<td class="num money">${b.buy?$money(b.buy):'—'}</td><td class="num money">${b.pass?$money(b.pass):'—'}</td>`:''}
    <td>${b.invoice}</td>
    ${seeBuy()?`<td>${b.carrierPay}</td>`:''}
    <td>${b.docs}</td>
    <td class="num">${b.variance}</td>
    <td>${b.funding==='Funded'?'<span class="badge g">Funded</span>':'<span class="badge a">'+b.funding+'</span>'}</td>
    <td><span class="badge ${b.sig}">${b.state}</span></td>
  </tr>`).join('');
  return `
  <div class="viewhead">
    <div><h1>Billing, Audit & Reconciliation</h1>
    <div class="sub">Three-way reconciliation on every load: approved customer charge ↔ approved carrier buy + pass-throughs ↔ final invoice and documents. Payments are blocked wherever funding or approval is missing.</div></div>
    <div class="actions"><button class="btn" onclick="toast('Duplicate scan complete — 0 found (demo)')">Run duplicate scan</button><button class="btn primary" ${readOnly()?'disabled':''} onclick="toast('Billing run prepared (demo)')">Prepare billing run</button></div>
  </div>
  <div class="grid cols-4" style="margin-bottom:14px">
    <div class="kpi"><span class="sig g"></span><div class="lbl">Invoice accuracy (30d)</div><div class="val">99.2%</div><div class="meta">1 variance caught pre-invoice</div></div>
    <div class="kpi"><span class="sig a"></span><div class="lbl">Billing holds</div><div class="val">2</div><div class="meta">1 claim review · 1 missing POD</div></div>
    <div class="kpi"><span class="sig g"></span><div class="lbl">Customer invoice aging</div><div class="val">4.1d</div><div class="meta">Avg. days outstanding</div></div>
    <div class="kpi"><span class="sig g"></span><div class="lbl">Funding control</div><div class="val">OK</div><div class="meta">No carrier pay released ahead of funding</div></div>
  </div>
  <div class="notice internal" style="margin-bottom:14px"><b>Funding control:</b> BHD does not finance Latham's carrier-payment or quick-pay obligations. Carrier payment on any load is blocked until the customer charge is approved and funding status is <b>Funded</b> — see the Funding column below.</div>
  <div class="card" style="margin-bottom:14px"><div class="cardbody flush tablewrap">
    <table class="data"><thead><tr><th>Load</th><th class="num">Customer charge</th>${seeBuy()?'<th class="num">Carrier buy</th><th class="num">Pass-through</th>':''}<th>Customer invoice</th>${seeBuy()?'<th>Carrier pay</th>':''}<th>Documents</th><th class="num">Variance</th><th>Funding</th><th>State</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div></div>
  <div class="grid cols-2">
    <div class="card"><div class="cardhead"><h2>Closeout checklist — BHD-26-1046</h2></div>
      <div class="cardbody">
        ${[['POD on file','done'],['Permits reconciled to receipts','done'],['Escort invoice matched','done'],['Accessorials approved','done'],['Customer invoice sent','done'],['Customer payment received','warn'],['Carrier payment released','warn'],['Load closed','open']].map(([t,st])=>`<div class="gate ${st}"><span class="tick">${st==='done'?'✓':st==='warn'?'…':'✕'}</span><div><div class="gt">${t}</div></div></div>`).join('')}
      </div>
    </div>
    <div class="card"><div class="cardhead"><h2>Disputes & audit queue</h2></div>
      <div class="cardbody flush"><table class="data"><thead><tr><th>Item</th><th>Type</th><th>Status</th></tr></thead><tbody>
        <tr><td>BHD-26-1047 · claim offset review</td><td>Carrier dispute (pending)</td><td><span class="badge a">In review</span></td></tr>
        <tr><td>EX-2195 · detention $135</td><td>Accessorial</td><td><span class="badge g">Approved & billed</span></td></tr>
        <tr><td>Aug permit reconciliation</td><td>Pass-through audit</td><td><span class="badge g">Closed — $0 variance</span></td></tr>
      </tbody></table></div>
    </div>
  </div>`;
};

/* =====================================================
   VIEW: REPORTS & SCORECARDS
   ===================================================== */
VIEWS.reports = function(){
  const reports = [
    ['Plant performance scorecard','Service, cost, exceptions and data quality by plant','Monthly + QBR'],
    ['Lane performance','OTP/OTD, transit, cost and exception rate by lane','Weekly'],
    ['Service performance','Pickup/delivery timeliness vs. SLA with root causes','Weekly'],
    ['Capacity coverage','Primary/backup depth and peak readiness by lane','Monthly'],
    ['Tender acceptance & equipment confirmation','Acceptance, retenders, confirmation timing','Weekly'],
    ['Tracking compliance','Ping/update compliance by load','Weekly'],
    ['Exceptions & root causes','Volume, aging, SLA, corrective and preventive actions','Weekly'],
    ['Claims','Open/closed claims with documentation status','Monthly'],
    ['Spend & rate variance','Spend vs. approved rates and lane history','Monthly'],
    ['Accessorials','Approved accessorials with validation backup','Monthly'],
    ['Billing accuracy & invoice aging','First-pass accuracy, disputes, aging','Monthly'],
    ['Data completeness','First-pass intake completeness by field and requester','Weekly'],
    ['Peak readiness','Surge capacity plan status ahead of season','Monthly'],
    ['Corrective-action plans','Open CAPs with owners and due dates','Monthly']
  ];
  return `
  <div class="viewhead">
    <div><h1>Reports & Scorecards</h1>
    <div class="sub">${isCust()?'Downloadable program reporting for Latham. Every export from this page is customer-safe by construction.':'Program reporting. Customer exports automatically strip carrier names, contacts, MC/DOT numbers, buy rates, internal notes and proprietary capacity data.'}</div></div>
    <div class="actions"><button class="btn primary" onclick="toast('Export queued — customer-safe filter applied automatically (demo)')">Export selected</button></div>
  </div>
  ${isCust()?'<div class="notice info" style="margin-bottom:14px">Exports are generated in <b>customer-safe mode</b>: carrier identity, carrier contacts, MC/DOT numbers, BHD buy rates and internal notes are excluded automatically — this is enforced by the platform, not by manual review.</div>':'<div class="notice internal" style="margin-bottom:14px"><b>Export governance:</b> the customer-safe filter is applied at the data layer for all Latham roles and any report shared externally. Internal exports are watermarked and logged.</div>'}
  <div class="card"><div class="cardbody flush tablewrap">
    <table class="data"><thead><tr><th style="width:34px"></th><th>Report</th><th>Contents</th><th>Cadence</th><th></th></tr></thead><tbody>
    ${reports.map((r,i)=>`<tr><td><input type="checkbox" aria-label="Select ${r[0]}"></td><td class="primaryline">${r[0]}</td><td><div class="subline" style="color:var(--ink)">${r[1]}</div></td><td>${r[2]}</td><td><button class="btn sm" onclick="toast('Downloading ${r[0]} (demo)')">Download</button></td></tr>`).join('')}
    </tbody></table>
  </div></div>`;
};

/* =====================================================
   VIEW: ADMINISTRATION & GOVERNANCE
   ===================================================== */
VIEWS.admin = function(){
  if(isCust()) return restrictedView('Administration');
  let tab = ROUTE_ARG || 'contract';
  window._wire = ()=>{};
  const tabs = [['contract','Commercial framework'],['access','Roles & permissions'],['rules','Rules & thresholds'],['integrations','Integrations'],['audit','Audit history']];
  const contract = `<div class="card"><div class="cardhead"><h2>Commercial & contractual record</h2><span class="hint">Recorded operating framework — managed outside the platform, tracked here</span></div>
    <div class="cardbody flush"><table class="data"><thead><tr><th>Provision</th><th>Status</th></tr></thead><tbody>
    ${GOVERNANCE.map(g=>`<tr><td class="primaryline">${g[0]}</td><td>${g[2]==='g'?'<span class="badge g">'+g[1]+'</span>':g[2]==='a'?'<span class="badge a">'+g[1]+'</span>':'<span class="badge n">'+g[1]+'</span>'}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="notice internal" style="margin-top:14px"><b>Why the 12-month extension matters:</b> BHD funds carrier procurement, plant onboarding, workflow configuration, portal development and network stabilization at its own expense. The term covers two peak seasons so the operating model can be proven and scaled before renewal.</div>`;
  const access = `<div class="grid cols-2">
    <div class="card"><div class="cardhead"><h2>Roles</h2></div><div class="cardbody flush"><table class="data"><thead><tr><th>Role</th><th>Carrier identity</th><th>Buy rates</th><th>Billing</th><th>Write</th></tr></thead><tbody>
      ${Object.entries(ROLE_META).map(([k,v])=>`<tr><td class="primaryline">${v.label}</td><td>${v.canSeeCarrier?'<span class="badge g">Yes</span>':'<span class="badge r">Never</span>'}</td><td>${v.canSeeBuy?'<span class="badge g">Yes</span>':'<span class="badge r">Never</span>'}</td><td>${v.billing?'<span class="badge g">Yes</span>':'<span class="badge n">No</span>'}</td><td>${v.readOnly?'<span class="badge n">Read-only (logged)</span>':v.customer?'<span class="badge b">Scoped</span>':'<span class="badge g">Yes</span>'}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="card"><div class="cardhead"><h2>Field- and plant-level controls</h2></div><div class="cardbody"><dl class="kv">
      <dt>Field-level permissions</dt><dd>Carrier name, MC/DOT, contacts, buy rate, internal notes = restricted class</dd>
      <dt>Plant-level permissions</dt><dd>Latham Plant users scoped to their plant only</dd>
      <dt>Customer-safe exports</dt><dd>Enforced at data layer for all customer roles</dd>
      <dt>Impersonation / test mode</dt><dd>Admins may view-as any role; sessions watermarked + logged</dd>
      <dt>Notification scrubbing</dt><dd>Outbound customer emails pass the same restricted-field filter</dd>
    </dl>
    <button class="btn" style="margin-top:10px" onclick="toast('View-as session started — watermarked and logged (demo)')">Start view-as session</button>
    </div></div></div>`;
  const rules = `<div class="grid cols-2">
    <div class="card"><div class="cardhead"><h2>Required-field & gate rules</h2></div><div class="cardbody"><dl class="kv">
      <dt>Intake hard-required</dt><dd>Dims, weight, consignee contact, unloading method (dealer/residential), PO</dd>
      <dt>Tender gate</dt><dd>13 gates — all must pass; executive override only</dd>
      <dt>Expedited service</dt><dd>Blocked unless consignee contact verified</dd>
      <dt>NC width rule</dt><dd>≥ 15'6" auto-flags superload review +1 day lead time</dd>
      <dt>Escort auto-classification</dt><dd>By state thresholds; site escorts manual</dd>
    </dl></div></div>
    <div class="card"><div class="cardhead"><h2>SLA & escalation configuration</h2></div><div class="cardbody"><dl class="kv">
      <dt>SLA targets</dt><dd>OTP 95% · OTD 93% · Tracking 95% · Exception ack 2h</dd>
      <dt>Escalation tree — JLW</dt><dd>Plant shipping → BHD Cust Ops → BHD on-call → BHD Exec ↔ Latham named contacts</dd>
      <dt>Approval thresholds</dt><dd>Spot &gt; $4,000 Exec · Accessorial &gt; $250 Ops lead · Override = Exec only</dd>
      <dt>Notifications</dt><dd>Per-user preferences; customer notices use customer-safe templates</dd>
    </dl></div></div></div>`;
  const integrations = `<div class="card"><div class="cardhead"><h2>Integrations</h2></div><div class="cardbody flush"><table class="data"><thead><tr><th>Integration</th><th>Purpose</th><th>Status</th></tr></thead><tbody>
    <tr><td class="primaryline">Email ingestion</td><td>Captures shipment email traffic to the load record during transition</td><td><span class="badge g">Active — audit trail on</span></td></tr>
    <tr><td class="primaryline">IFS / ERP (Latham)</td><td>Order + invoice integration replacing email flow</td><td><span class="badge a">Scoping — target Q1 2027</span></td></tr>
    <tr><td class="primaryline">Permit services</td><td>State permit filing + status</td><td><span class="badge g">Active</span></td></tr>
    <tr><td class="primaryline">Tracking (ELD / app)</td><td>Position + milestone feed</td><td><span class="badge g">Active</span></td></tr>
    <tr><td class="primaryline">Accounting</td><td>Invoices, carrier pay, funding status</td><td><span class="badge g">Active</span></td></tr>
  </tbody></table></div></div>`;
  const audit = `<div class="card"><div class="cardhead"><h2>Audit history</h2><span class="hint">Every operational and financial decision is traceable</span></div><div class="cardbody flush"><table class="data"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Record</th></tr></thead><tbody>
    <tr><td>Sep 8, 09:41</td><td>R. Ostrander (Capacity)</td><td>Filed TN permit on estimate</td><td>BHD-26-1045</td></tr>
    <tr><td>Sep 8, 08:20</td><td>M. Delgado (Cust Ops)</td><td>Sent missing-data request to customer</td><td>EX-2203</td></tr>
    <tr><td>Sep 7, 15:02</td><td>R. Ostrander (Capacity)</td><td>Rebooked escorts; internal note added</td><td>BHD-26-1043</td></tr>
    <tr><td>Sep 7, 14:12</td><td>G. Harris (Executive)</td><td>Approved NC permit expedite fee $95</td><td>BHD-26-1043</td></tr>
    <tr><td>Sep 7, 10:44</td><td>System</td><td>Tender accepted; equipment confirmed</td><td>BHD-26-1042</td></tr>
    <tr><td>Sep 6, 12:40</td><td>T. Nguyen (Billing)</td><td>Approved detention $135 with GPS backup</td><td>EX-2195</td></tr>
    <tr><td>Sep 5, 16:41</td><td>K. Whitfield (Cust Ops)</td><td>Opened damage exception; customer notified</td><td>EX-2199 / BHD-26-1047</td></tr>
    <tr><td>Sep 4, 08:22</td><td>System</td><td>Auto-retendered to backup after rejection (12 min)</td><td>BHD-26-1038</td></tr>

  const body = {contract,access,rules,integrations,audit}[tab];
  return `

/* ===== boot ===== */
setRole('bhd-exec');
</script>
